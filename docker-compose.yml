  pug:
    build: .
    container_name: css-pug
    working_dir: /css
    volumes:
      - ./instances/pug/css:/css
      - ./instances/pug/sdk32:/home/steam/.steam/sdk32:ro
    restart: unless-stopped
    stdin_open: true
    tty: true
    env_file: .env
    command: ["-game", "cstrike", "-console", "-tickrate", "100", "-ip", "0.0.0.0", "-port", "27016", "+maxplayers", "24", "+sv_setsteamaccount", "${STEAM_LOGIN_TOKEN}", "+map", "de_dust2"]
    ports: 
      - "27016:27016/udp"
      - "27016:27016/tcp"
    networks:
      - default
      - sourcebans_net

  zombie:
    build: .
    container_name: css-zombie
    working_dir: /css
    volumes:
      - ./instances/zombie/css:/css
      - ./instances/zombie/sdk32:/home/steam/.steam/sdk32:ro
    restart: unless-stopped
    stdin_open: true
    tty: true
    env_file: .env
    command: ["-game", "cstrike", "-console", "-tickrate", "100", "-ip", "0.0.0.0", "-port", "27025", "+maxplayers", "32", "+sv_setsteamaccount", "${STEAM_LOGIN_TOKEN_ZOMBIE}", "+map", "zm_westwood_final"]
    ports: 
      - "27025:27025/udp"
      - "27025:27025/tcp"
    networks:
      - default
      - sourcebans_net

  scoutzknivez:
    build: .
    container_name: css-scoutzknivez
    working_dir: /css
    volumes:
      - ./instances/scoutzknivez/css:/css
      - ./instances/scoutzknivez/sdk32:/home/steam/.steam/sdk32:ro
    restart: unless-stopped
    stdin_open: true
    tty: true
    env_file: .env
    command: ["-game", "cstrike", "-console", "-tickrate", "100", "-ip", "0.0.0.0", "-port", "27035", "+maxplayers", "32", "+sv_setsteamaccount", "${STEAM_LOGIN_TOKEN_SCOUTZKNIVEZ}", "+map", "scoutzknivez"]
    ports: 
      - "27035:27035/udp"
      - "27035:27035/tcp"
    networks:
      - default
      - sourcebans_net

  fastdl:
    image: nginx:alpine
    container_name: css-fastdl
    network_mode: host
    volumes:
      - ./instances/pug/css/cstrike:/usr/share/nginx/html/pug:ro
      - ./instances/zombie/css/cstrike:/usr/share/nginx/html/zombie:ro
      - ./instances/scoutzknivez/css/cstrike:/usr/share/nginx/html/scoutzknivez:ro
      - ./img:/usr/share/nginx/html/img/
      - ./fastdl.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

networks:
  sourcebans_net:
    external: true

