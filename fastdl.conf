  server {
      listen 27020;

      root /usr/share/nginx/html;
      autoindex off;

      # Shared assets (MOTD banner, etc.)
      location ^~ /img/ {
          expires -1;
      }

      # Only serve content clients need to download
      location ~ ^/(pug|zombie|scoutzknivez)/(maps|materials|models|sound)/ {
          expires 7d;
      }

      # Block everything else
      location / {
          return 403;
      }
  }
